<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>CRT Terminal</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body class="crt-flicker">
    <!-- SVG-фильтры  -->
    <svg style="position: absolute; width: 0; height: 0">
      <defs>
        <!-- Искажение экрана (бочкообразное) -->
        <filter id="crt-distort">
          <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Свечение (bloom) -->
        <filter id="bloom">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- Слои эффектов -->
    <div class="crt-vignette"></div>
    <div class="crt-noise"></div>

    <!-- Контент -->
    <h1 class="crt-chromatic">TEST PROTOCOL</h1>
    <p class="crt-chromatic">System online...</p>
    <div class="crt-chromatic">12/158</div>
  </body>
</html>
